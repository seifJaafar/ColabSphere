<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .email-container {
        max-width: 600px;
        margin: 20px auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      }
      .header {
        background-color: #007bff;
        color: #ffffff;
        padding: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
      }
      .content {
        padding: 20px;
        font-size: 16px;
        color: #333333;
        line-height: 1.5;
      }
      .password-box {
        background-color: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 5px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        margin: 15px 0;
      }
      .button {
        display: block;
        width: 200px;
        margin: 20px auto;
        padding: 12px;
        background-color: #007bff;
        color: #ffffff;
        text-align: center;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
      }
      .footer {
        text-align: center;
        font-size: 14px;
        color: #666666;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="header">🔐 Reset Password</div>
      <div class="content">
        <p>Dear <b>{{Name}}</b>,</p>
        <p>
          We have generated a temporary reset password Link for you. Please use
          it to log in before it expires.
        </p>
        <a href="{{ResetLink}}" class="button">Change Password</a>

        <p>
          If you did not request this, please ignore this email or contact
          support.
        </p>
        <p>Best Regards,<br /><b>Team</b></p>
      </div>

      <div class="footer">
        Need help? <a href="mailto:s3if2003@gmail.com">Contact Support</a>
      </div>
    </div>
  </body>
</html>
